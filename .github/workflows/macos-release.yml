name: Diao macOS release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build and verify Apple silicon DMG
        env:
          DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
          DIAO_UPDATE_PUBLIC_KEY: ${{ vars.DIAO_UPDATE_PUBLIC_KEY }}
          DIAO_SPARKLE_PRIVATE_KEY: ${{ github.ref_type == 'tag' && secrets.DIAO_SPARKLE_PRIVATE_KEY || '' }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then version=0.1; fi
          if [[ -n "${DIAO_UPDATE_PUBLIC_KEY:-}" && "$GITHUB_REF_TYPE" == tag && -z "${DIAO_SPARKLE_PRIVATE_KEY:-}" ]]; then
            echo '缺少 Diao 更新签名密钥。' >&2
            exit 1
          fi
          bash scripts/build_macos_release.sh "$RUNNER_TEMP/tab-cadence" "$version"
      - uses: actions/upload-artifact@v6
        with:
          name: tab-cadence-macos-arm64
          path: ${{ runner.temp }}/tab-cadence/*
          if-no-files-found: error
          retention-days: 7

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: tab-cadence-macos-arm64
          path: release-assets
      - name: Stage GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          cd release-assets
          shasum -a 256 -c *.sha256
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
            --title "Diao ${GITHUB_REF_NAME#v}" \
            --notes 'Apple silicon, macOS 27.2+. This DMG uses ad hoc signing. See the installation guide in the disk image.' \
            ./*
